  #       uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
  #       with:
  #         node-version: 22
  #         cache: npm
  #
  #     - name: Install frontend dependencies
  #       run: npm ci
  #
  #     - name: Audit frontend dependencies
  #       run: npm audit --audit-level=high
  #
  # api-dependencies:
  #   name: "API Dependency Scan"
  #   needs: frontend-dependencies
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 15
  #
  #   defaults:
  #     run:
  #       working-directory: api
  #
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
  #       with:
  #         node-version: 22
  #         cache: npm
  #         cache-dependency-path: api/package-lock.json
  #
  #     - name: Install API dependencies
  #       run: npm ci
  #
  #     - name: Audit API dependencies
  #       run: npm audit --audit-level=high

  docker-build:
    name: "Build, Scan and Sign Docker Images"
    needs: sast
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60

    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set image names
        id: images
        shell: bash
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          REPO_LC="${GITHUB_REPOSITORY##*/}"
          REPO_LC="${REPO_LC,,}"

          echo "frontend=ghcr.io/${OWNER_LC}/${REPO_LC}-frontend" >> "$GITHUB_OUTPUT"
          echo "api=ghcr.io/${OWNER_LC}/${REPO_LC}-api" >> "$GITHUB_OUTPUT"

      - name: Verify Docker installation
        run: |
          docker --version
          docker buildx version

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          buildkitd-config-inline: |
            [registry."192.168.122.125:8082"]
              http = true
              insecure = true

      - name: Login to GHCR
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Harbor
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and Push Frontend
        id: build-frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'release' }}
          tags: |
            ${{ steps.images.outputs.frontend }}:latest
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
            ${{ secrets.HARBOR_HOST }}/devsecops-portfolio/frontend:latest
            ${{ secrets.HARBOR_HOST }}/devsecops-portfolio/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and Push API
        id: build-api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'release' }}
          tags: |
            ${{ steps.images.outputs.api }}:latest
            ${{ steps.images.outputs.api }}:${{ github.sha }}
            ${{ secrets.HARBOR_HOST }}/devsecops-portfolio/api:latest
            ${{ secrets.HARBOR_HOST }}/devsecops-portfolio/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Activity 101: Generate GitHub build provenance attestations
      - name: Generate Frontend Build Attestation
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.images.outputs.frontend }}
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: false

      - name: Generate API Build Attestation
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.images.outputs.api }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: false

      - name: Install Cosign
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Verify Cosign installation
        if: github.event_name == 'push' || github.event_name == 'release'
        run: cosign version

      # Activity 105: Temporary supply-chain attack simulation
      # This step is expected to FAIL because the test image has no Cosign signature.
      # Remove this step after collecting the GitHub Actions evidence.
      - name: Test Supply Chain Attack - Unsigned Image
        if: github.event_name == 'push'
        continue-on-error: false
        run: |
          cosign verify \
            docker.io/library/alpine:3.20

      - name: Sign Frontend image on GHCR
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          IMAGE: ${{ steps.images.outputs.frontend }}
          DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          echo "Signing frontend image on GHCR..."
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Sign API image on GHCR
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          IMAGE: ${{ steps.images.outputs.api }}
          DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          echo "Signing API image on GHCR..."
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Sign Frontend image on Harbor
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_HOST }}
          DIGEST: ${{ steps.build-frontend.outputs.digest }}
        run: |
          IMAGE="${HARBOR_HOST}/devsecops-portfolio/frontend"

          echo "Signing Harbor frontend image..."
          cosign sign --yes --allow-http-registry "${IMAGE}@${DIGEST}"

      - name: Sign API image on Harbor
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_HOST }}
          DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          IMAGE="${HARBOR_HOST}/devsecops-portfolio/api"

          echo "Signing Harbor API image..."
          cosign sign --yes --allow-http-registry "${IMAGE}@${DIGEST}"

      # Activity 104: Reject unsigned or untrusted Docker images
      - name: Enforce Frontend Signature on GHCR
        continue-on-error: false
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          IMAGE: ${{ steps.images.outputs.frontend }}
          DIGEST: ${{ steps.build-frontend.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Enforce API Signature on GHCR
        continue-on-error: false
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          IMAGE: ${{ steps.images.outputs.api }}
          DIGEST: ${{ steps.build-api.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Enforce Frontend Signature on Harbor
        continue-on-error: false
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_HOST }}
          DIGEST: ${{ steps.build-frontend.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="${HARBOR_HOST}/devsecops-portfolio/frontend"

          cosign verify \
            --allow-http-registry \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Enforce API Signature on Harbor
        continue-on-error: false
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_HOST }}
          DIGEST: ${{ steps.build-api.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="${HARBOR_HOST}/devsecops-portfolio/api"

          cosign verify \
            --allow-http-registry \
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Inspect Harbor Frontend Manifest
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          IMAGE: ${{ secrets.HARBOR_HOST }}/devsecops-portfolio/frontend
        run: docker buildx imagetools inspect "$IMAGE:latest"

      - name: Inspect Harbor API Manifest
        if: github.event_name == 'push' || github.event_name == 'release'
        env:
          IMAGE: ${{ secrets.HARBOR_HOST }}/devsecops-portfolio/api
        run: docker buildx imagetools inspect "$IMAGE:latest"

      - name: Create SBOM directory
        if: github.event_name == 'push' || github.event_name == 'release'
        run: mkdir -p sbom

      - name: Syft - Generate Frontend SBOM
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom/frontend.spdx.json
          artifact-name: sbom-frontend-${{ github.sha }}
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: ${{ github.event_name == 'release' }}

      - name: Syft - Generate API SBOM
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.images.outputs.api }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom/api.spdx.json
          artifact-name: sbom-api-${{ github.sha }}
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: ${{ github.event_name == 'release' }}

      - name: Trivy - Scan Frontend Image
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Trivy - Scan API Image
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.api }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
