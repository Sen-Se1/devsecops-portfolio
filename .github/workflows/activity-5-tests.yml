
name: Activity 5 - Sequential CI Security Pipeline

on:
  push:
    branches:
      - Activite-5

  pull_request:
    branches:
      - Activite-5

permissions:
  contents: read

concurrency:
  group: activity-5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================
  # STAGE 1 - FRONTEND TESTS
  # ==========================================
  frontend-tests:
    name: "Stage 1 - Frontend Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --runInBand


  # ==========================================
  # STAGE 2 - API TESTS
  # ==========================================
  api-tests:
    name: "Stage 2 - API Tests"
    needs: frontend-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: portfolio_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_user -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://portfolio_user:portfolio_pass@localhost:5432/portfolio_test?schema=public
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run API tests
        run: npm test


  # ==========================================
  # STAGE 3 - SECRET SCANNING
  # ==========================================
  secret-scanning:
    name: "Stage 3 - Secret Scanning"
    needs: api-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================
  # STAGE 4 - SAST
  # ==========================================
  sast:
    name: "Stage 4 - SAST Semgrep"
    needs: secret-scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Create Python virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Install Semgrep
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install semgrep

      - name: Run Semgrep SAST scan
        run: semgrep scan --config auto --error .


  # ==========================================
  # STAGE 5 - FRONTEND DEPENDENCY SCANNING
  # ==========================================
  frontend-dependencies:
    name: "Stage 5 - Frontend Dependency Scan"
    needs: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high


  # ==========================================
  # STAGE 6 - API DEPENDENCY SCANNING
  # ==========================================
  api-dependencies:
    name: "Stage 6 - API Dependency Scan"
    needs: frontend-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Audit API dependencies
        run: npm audit --audit-level=high

  # ==========================================
  # STAGE 7 - DOCKER IMAGE BUILD
  # ==========================================
  docker-build:
    name: "Stage 7 - Build Docker Images"
    needs: api-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Verify Docker installation
        run: docker --version

      # ----------------------------------------
      # Build frontend image
      # ----------------------------------------
      - name: Build Frontend Docker Image
        run: |
          docker build \
            --file Dockerfile \
            --tag devsecops-portfolio:${GITHUB_SHA} \
            --tag devsecops-portfolio:latest \
            .

      # ----------------------------------------
      # Build API image
      # ----------------------------------------
      - name: Build API Docker Image
        run: |
          docker build \
            --file api/Dockerfile \
            --tag devsecops-api:${GITHUB_SHA} \
            --tag devsecops-api:latest \
            ./api

      # ----------------------------------------
      # Verify both images
      # ----------------------------------------
      - name: Verify Docker Images
        run: |
          echo "=== Docker Images Built Successfully ==="
          docker image inspect devsecops-portfolio:${GITHUB_SHA}
          docker image inspect devsecops-api:${GITHUB_SHA}

      - name: Display Docker Images
        run: docker images
