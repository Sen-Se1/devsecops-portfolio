---
- name: Installer Docker Engine depuis le depot officiel
  hosts: portfolio_servers
  become: true
  gather_facts: true

  tasks:
    - name: Installer Docker CE et le plugin Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Activer et demarrer le service Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Verifier la version Docker
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Afficher la version Docker
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Verifier la version Docker Compose
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false

    - name: Afficher la version Docker Compose
      ansible.builtin.debug:
        var: compose_version.stdout
