---
- name: Installer Docker Engine depuis les depots Ubuntu
  hosts: portfolio_servers
  become: true
  gather_facts: true

  tasks:
    - name: Installer Docker et le plugin Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Activer et demarrer le service Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Verifier la version Docker
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Afficher la version Docker
      ansible.builtin.debug:
        var: docker_version.stdout
