services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: devsecops-api:latest
    container_name: devsecops-api
    restart: unless-stopped
    environment:
      PORT: 4000
    expose:
      - "4000"
    networks:
      - portfolio-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: devsecops-portfolio:latest
    container_name: devsecops-portfolio
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge
