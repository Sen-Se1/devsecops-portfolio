---
- name: Download NodeSource setup script
  ansible.builtin.get_url:
    url: "https://deb.nodesource.com/setup_{{ node_major }}.x"
    dest: /tmp/nodesource_setup.sh
    mode: "0755"
  become: true

- name: Configure NodeSource repository
  ansible.builtin.command:
    cmd: "/tmp/nodesource_setup.sh"
    creates: /etc/apt/sources.list.d/nodesource.sources
  become: true

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true
  become: true

- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true
    state: present
  become: true


